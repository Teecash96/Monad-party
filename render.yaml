# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: proof-of-play-db
    plan: free
    region: frankfurt
    databaseName: proof_of_play
    user: proof_of_play

services:
  - type: web
    name: proof-of-play-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proof-of-play-db
          property: connectionString
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: MONAD_CHAIN_ID
        value: "10143"
      - key: PARTY_GAME_ADDRESS
        sync: false
      - key: PARTY_GAME_URL
        sync: false
      - key: PARTY_MINIMUM_MILESTONE
        value: "1"
      - key: REQUIRE_FULL_CONFIG
        value: "true"
      - key: REQUIRED_FEATURES
        value: network,twitter,contracts,party,indexing,publishing
      - key: PUBLISH_ROOT
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTER_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ELIGIBILITY_REGISTRY_ADDRESS
        sync: false
      - key: RAFFLE_CORE_ADDRESS
        sync: false
      - key: RAFFLE_DEPLOYMENT_BLOCK
        sync: false
      - key: ADMIN_WALLET_ADDRESS
        sync: false

  - type: web
    name: proof-of-play-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: NEXT_PUBLIC_MONAD_CHAIN_ID
        value: "10143"
      - key: NEXT_PUBLIC_MONAD_CHAIN_NAME
        value: Monad Testnet
      - key: NEXT_PUBLIC_MONAD_EXPLORER_URL
        value: https://testnet.monadvision.com
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_RAFFLE_CORE_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_ELIGIBILITY_REGISTRY_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_PARTY_GAME_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
