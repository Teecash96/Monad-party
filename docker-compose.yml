services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monad_raffle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - monad_raffle_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monad_raffle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  monad_raffle_data:
